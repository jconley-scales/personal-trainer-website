      sites add those to "lock" mobile layout, but that also blocks the
      pinch-to-zoom many older users rely on. Leaving scale unrestricted is
      required for the "scalable up to 200%" requirement.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
